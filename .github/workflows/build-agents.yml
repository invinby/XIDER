name: "Build & Release Standalone Agents"

on:
  push:
    branches:
      - "xider-local-prep-*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-ci:
    name: "Release test gate"
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-windows:
    name: "Build Windows Agent (EXE)"
    runs-on: windows-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install dependencies and Nuitka"
        run: |
          python -m pip install --upgrade pip
          pip install -r XGENT-WDS/requirements.txt
          pip install nuitka==4.3.1

      - name: "Build Windows Agent and Guard Keeper as compiled one-file apps"
        run: |
          python tools/build_nuitka_windows.py
          Copy-Item XGENT-WDS/.env.example XGENT-WDS/dist/nuitka/.env.example
          python tools/verify_command_approval_bundle.py --nuitka-executable XGENT-WDS/dist/nuitka/XGENT-WDS.exe
          $unexpected = Get-ChildItem XGENT-WDS/dist/nuitka -Recurse -File | Where-Object {
            $_.Name -match '\.(py[co]?|ps1|psm1|bat|cmd|sh)$' -or ($_.Name -eq '.env')
          }
          if ($unexpected) { throw ('Unexpected plaintext helper/source or private .env in Windows release: ' + ($unexpected.FullName -join ', ')) }
          $expected = @('.env.example', 'XGENT-WDS.exe', 'XIDER-Guard-Keeper.exe')
          $actual = @(Get-ChildItem XGENT-WDS/dist/nuitka -File | ForEach-Object Name | Sort-Object)
          $expectedSorted = @($expected | Sort-Object)
          if (Compare-Object $expectedSorted $actual) {
            throw ('Unexpected Windows release contents: ' + ($actual -join ', '))
          }
          $packageRoot = 'XGENT-WDS/dist/nuitka'
          $package = Join-Path $env:RUNNER_TEMP 'XGENT-WDS-Windows.zip'
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $package -Force
          python tools/verify_command_approval_bundle.py --public-only-zip $package
          Copy-Item $package XGENT-WDS/dist/nuitka/XGENT-WDS-Windows.zip

      - name: "Upload Windows EXE Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XGENT-WDS-Windows
          path: XGENT-WDS/dist/nuitka/*

  build-macos:
    name: "Build compiled macOS Agent and recovery layers"
    runs-on: macos-latest
    environment:
      name: xider-macos-signing
    env:
      XIDER_MACOS_SIGNING_IDENTITY: ${{ secrets.XIDER_MACOS_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Block release when signing or notarization credentials are missing"
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/verify_macos_bundle.py --release-credentials

      - name: "Import Apple certificate into temporary keychain"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"xider-signing.p12").write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_B64"],validate=True))'
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/xider-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/xider-signing.keychain-db"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/xider-signing.keychain-db"
          security import "$RUNNER_TEMP/xider-signing.p12" -k "$RUNNER_TEMP/xider-signing.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/xider-signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/xider-signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r XGENT-MCS/requirements.txt nuitka==4.3.1

      - name: "Compile macOS bundles with Nuitka"
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python tools/build_nuitka_macos.py
            codesign -dv --verbose=4 XGENT-MCS/dist/nuitka/XIDER.app
            codesign --verify --deep --strict XGENT-MCS/dist/nuitka/XIDER-Guard-Keeper.app
            codesign --verify --deep --strict XGENT-MCS/dist/nuitka/XIDER-Layers.app
            plutil -p XGENT-MCS/dist/nuitka/XIDER.app/Contents/Info.plist
          else
            python tools/build_nuitka_macos.py --unsigned-preview
          fi

      - name: "Notarize and staple without changing signed app contents"
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p "$RUNNER_TEMP/xider-notary-payload"
          ditto XGENT-MCS/dist/nuitka/XIDER.app "$RUNNER_TEMP/xider-notary-payload/XIDER.app"
          ditto XGENT-MCS/dist/nuitka/XIDER-Guard-Keeper.app "$RUNNER_TEMP/xider-notary-payload/XIDER-Guard-Keeper.app"
          ditto XGENT-MCS/dist/nuitka/XIDER-Layers.app "$RUNNER_TEMP/xider-notary-payload/XIDER-Layers.app"
          ditto -c -k --sequesterRsrc "$RUNNER_TEMP/xider-notary-payload" "$RUNNER_TEMP/xider-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/xider-notarization.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple XGENT-MCS/dist/nuitka/XIDER.app
          xcrun stapler staple XGENT-MCS/dist/nuitka/XIDER-Guard-Keeper.app
          xcrun stapler staple XGENT-MCS/dist/nuitka/XIDER-Layers.app
          python tools/verify_macos_bundle.py XGENT-MCS/dist/nuitka/XIDER.app --distribution
          codesign --verify --deep --strict XGENT-MCS/dist/nuitka/XIDER-Guard-Keeper.app
          xcrun stapler validate XGENT-MCS/dist/nuitka/XIDER-Guard-Keeper.app
          codesign --verify --deep --strict XGENT-MCS/dist/nuitka/XIDER-Layers.app
          xcrun stapler validate XGENT-MCS/dist/nuitka/XIDER-Layers.app

      - name: "Create and verify the final ZIP artifact"
        run: |
          cd XGENT-MCS
          mkdir -p dist
          cp .env.example dist/.env.example
          ditto -c -k --sequesterRsrc --keepParent dist/nuitka/XIDER-Guard-Keeper.app dist/Guard-Keeper-macOS.zip
          ditto dist/nuitka/XIDER-Guard-Keeper.app dist/XIDER-Guard-Keeper.app
          ditto dist/nuitka/XIDER-Layers.app dist/XIDER-Layers.app
          ditto dist/nuitka/XIDER.app dist/XIDER.app
          cd dist
          zip -r XGENT-MCS-macos-bundle.zip XIDER.app XIDER-Guard-Keeper.app XIDER-Layers.app .env.example
          if unzip -Z1 XGENT-MCS-macos-bundle.zip | grep -Eiq '\.(py[co]?|ps1|psm1|bat|cmd|sh)$'; then
            echo 'Release bundle unexpectedly contains plaintext source or helper scripts.' >&2
            exit 1
          fi
          python ../../tools/verify_command_approval_bundle.py --public-only-zip XGENT-MCS-macos-bundle.zip
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            mkdir "$RUNNER_TEMP/xider-final-extracted"
            ditto -x -k XGENT-MCS-macos-bundle.zip "$RUNNER_TEMP/xider-final-extracted"
            python ../../tools/verify_macos_bundle.py "$RUNNER_TEMP/xider-final-extracted/XIDER.app" --distribution
            codesign -dv --verbose=4 "$RUNNER_TEMP/xider-final-extracted/XIDER.app"
            codesign --verify --deep --strict "$RUNNER_TEMP/xider-final-extracted/XIDER-Guard-Keeper.app"
            codesign --verify --deep --strict "$RUNNER_TEMP/xider-final-extracted/XIDER-Layers.app"
            xcrun stapler validate "$RUNNER_TEMP/xider-final-extracted/XIDER-Guard-Keeper.app"
            xcrun stapler validate "$RUNNER_TEMP/xider-final-extracted/XIDER-Layers.app"
            plutil -p "$RUNNER_TEMP/xider-final-extracted/XIDER.app/Contents/Info.plist"
          else
            echo 'Unsigned preview artifact only; it is not a distributable macOS release.'
          fi

      - name: "Upload compiled macOS app artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XGENT-MCS-macOS
          path: |
            XGENT-MCS/dist/XGENT-MCS-macos-bundle.zip
            XGENT-MCS/dist/Guard-Keeper-macOS.zip

      - name: "Remove temporary signing material"
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/xider-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/xider-signing.p12"


  pack-components:
    name: "Package Guard Keeper and server components"
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Download the Windows agent and Guard Keeper build"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XGENT-WDS-Windows
          path: artifacts/windows

      - name: "Download the signed macOS Guard Keeper build"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XGENT-MCS-macOS
          path: artifacts/macos

      - name: "Create source packages from the tagged tree"
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=XIDER-source/ \
            --output=artifacts/XIDER-source.zip HEAD
          cp artifacts/windows/XIDER-Guard-Keeper.exe artifacts/
          cp artifacts/windows/XGENT-WDS-Windows.zip artifacts/XGENT-WDS-Windows.zip
          cp artifacts/macos/XGENT-MCS-macos-bundle.zip artifacts/XGENT-MCS-macos-bundle.zip
          (cd artifacts && zip -q Guard-Keeper-Windows.zip XIDER-Guard-Keeper.exe)
          cp artifacts/macos/Guard-Keeper-macOS.zip artifacts/Guard-Keeper-macOS.zip
          for asset in Guard-Keeper-Windows.zip Guard-Keeper-macOS.zip; do
            unzip -t "artifacts/$asset"
          done
          unzip -Z1 artifacts/Guard-Keeper-Windows.zip | grep -Fxq XIDER-Guard-Keeper.exe
          unzip -Z1 artifacts/Guard-Keeper-macOS.zip | grep -Fq 'XIDER-Guard-Keeper.app/Contents/MacOS/XIDER-Guard-Keeper'
          if unzip -Z1 artifacts/Guard-Keeper-macOS.zip | grep -Eq '(^|/)(guardian_recovery|release_signature|update_package)\.py$'; then
            echo 'Guard Keeper package unexpectedly contains Python recovery sources.' >&2
            exit 1
          fi
          unzip -t artifacts/XGENT-WDS-Windows.zip
          unzip -Z1 artifacts/XGENT-WDS-Windows.zip | grep -Fxq XGENT-WDS.exe
          unzip -Z1 artifacts/XGENT-WDS-Windows.zip | grep -Fxq XIDER-Guard-Keeper.exe
          unzip -Z1 artifacts/XGENT-WDS-Windows.zip | grep -Fxq .env.example
          if unzip -Z1 artifacts/XGENT-WDS-Windows.zip | grep -Eiq '\.(py[co]?|ps1|psm1|bat|cmd|sh)$'; then
            echo 'Windows release package contains plaintext source or helper scripts.' >&2
            exit 1
          fi
          unzip -t artifacts/macos/XGENT-MCS-macos-bundle.zip
          unzip -Z1 artifacts/macos/XGENT-MCS-macos-bundle.zip | grep -Fq 'XIDER-Guard-Keeper.app/Contents/MacOS/XIDER-Guard-Keeper'
          unzip -Z1 artifacts/macos/XGENT-MCS-macos-bundle.zip | grep -Fq 'XIDER-Layers.app/Contents/MacOS/XIDER-Layers'
          unzip -Z1 artifacts/macos/XGENT-MCS-macos-bundle.zip | grep -Fq .env.example
          if unzip -Z1 artifacts/macos/XGENT-MCS-macos-bundle.zip | grep -Eiq '\.(py[co]?|ps1|psm1|bat|cmd|sh)$'; then
            echo 'macOS release package contains plaintext source or helper scripts.' >&2
            exit 1
          fi
          git archive --format=zip --output=artifacts/X-STAB-server.zip HEAD TG-BOT-SERVER deploy XGENT-MCS/release_signature.py
          python tools/verify_command_approval_bundle.py \
            --public-only-zip artifacts/XIDER-source.zip \
            --public-only-zip artifacts/XGENT-WDS-Windows.zip \
            --public-only-zip artifacts/macos/XGENT-MCS-macos-bundle.zip \
            --public-only-zip artifacts/Guard-Keeper-Windows.zip \
            --public-only-zip artifacts/Guard-Keeper-macOS.zip \
            --public-only-zip artifacts/X-STAB-server.zip

      - name: "Upload component packages"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XIDER-Components
          path: artifacts/*.zip

  create-release:
    name: "Publish GitHub Release"
    needs: [release-ci, build-windows, build-macos, pack-components]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: xider-release-signing
    permissions:
      contents: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Download Windows Artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XGENT-WDS-Windows
          path: artifacts/windows

      - name: "Download macOS Artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XGENT-MCS-macOS
          path: artifacts/macos

      - name: "Download Guard Keeper and server packages"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XIDER-Components
          path: artifacts/components

      - name: "Install release signing dependency"
        run: python -m pip install cryptography

      - name: "Build signed asset inventory"
        env:
          XIDER_RELEASE_PRIVATE_KEY_B64: ${{ secrets.XIDER_RELEASE_PRIVATE_KEY_B64 }}
          # Public endpoint, embedded in signed installer bodies. Never put credentials here.
          XIDER_DOCK_URL: ${{ vars.XIDER_DOCK_URL }}
        run: |
          cp artifacts/windows/XGENT-WDS.exe artifacts/XGENT-WDS.exe
          cp artifacts/windows/XGENT-WDS-Windows.zip artifacts/XGENT-WDS-Windows.zip
          cp artifacts/macos/XGENT-MCS-macos-bundle.zip artifacts/XGENT-MCS-macos-bundle.zip
          cp artifacts/components/*.zip artifacts/
          cp deploy/bootstrap-agent.ps1 artifacts/XIDER-bootstrap-windows.ps1
          cp deploy/bootstrap.sh artifacts/XIDER-bootstrap-macos.sh
          python tools/sign_bootstrap.py "${GITHUB_REF_NAME}" "${GITHUB_SHA}" artifacts
          python tools/build_bootstrap_commands.py "${GITHUB_SHA}" "${GITHUB_REF_NAME}" artifacts/XIDER-QUICKSTART.txt
          python tools/build_install_launchers.py "${GITHUB_SHA}" "${GITHUB_REF_NAME}" artifacts --pages-dir artifacts/install-pages
          python tools/sign_installers.py artifacts
          python tools/build_release_manifest.py "${GITHUB_REF_NAME}" artifacts --require-signature

      - name: "Upload short installer entry points for GitHub Pages"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XIDER-install-pages
          path: artifacts/install-pages/
          include-hidden-files: true

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            artifacts/XGENT-WDS.exe
            artifacts/XGENT-WDS-Windows.zip
            artifacts/XGENT-MCS-macos-bundle.zip
            artifacts/Guard-Keeper-Windows.zip
            artifacts/Guard-Keeper-macOS.zip
            artifacts/X-STAB-server.zip
            artifacts/XIDER-source.zip
            artifacts/XIDER-bootstrap-windows.ps1
            artifacts/XIDER-bootstrap-macos.sh
            artifacts/XIDER-bootstrap-windows.ps1.sig
            artifacts/XIDER-bootstrap-macos.sh.sig
            artifacts/XIDER-install-windows.ps1
            artifacts/XIDER-install-macos.sh
            artifacts/XIDER-install-windows.ps1.sig
            artifacts/XIDER-install-macos.sh.sig
            artifacts/XIDER-QUICKSTART.txt
            artifacts/release-manifest.json
          draft: false
          prerelease: false
          body_path: ${{ github.workspace }}/docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
