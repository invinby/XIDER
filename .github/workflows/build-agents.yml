name: "Build & Release Standalone Agents"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: "Build Windows Agent (EXE)"
    runs-on: windows-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r XGENT-WDS/requirements.txt
          pip install pyinstaller

      - name: "Build Windows EXE via PyInstaller"
        run: |
          cd XGENT-WDS
          pyinstaller --clean XGENT-WDS.spec

      - name: "Upload Windows EXE Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: XGENT-WDS-Windows
          path: XGENT-WDS/dist/XGENT-WDS.exe

  build-macos:
    name: "Build macOS Agent (Mach-O Standalone)"
    runs-on: macos-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r XGENT-MCS/requirements.txt
          pip install pyinstaller

      - name: "Build macOS Standalone Binary via PyInstaller"
        run: |
          cd XGENT-MCS
          pyinstaller --clean XGENT-MCS.spec
          chmod +x dist/XGENT-MCS
          cd dist
          zip -r XGENT-MCS-macos.zip XGENT-MCS

      - name: "Upload macOS Binary Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: XGENT-MCS-macOS
          path: XGENT-MCS/dist/XGENT-MCS-macos.zip

  create-release:
    name: "Publish GitHub Release"
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: "Download Windows Artifact"
        uses: actions/download-artifact@v4
        with:
          name: XGENT-WDS-Windows
          path: artifacts/windows

      - name: "Download macOS Artifact"
        uses: actions/download-artifact@v4
        with:
          name: XGENT-MCS-macOS
          path: artifacts/macos

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/XGENT-WDS.exe
            artifacts/macos/XGENT-MCS-macos.zip
          draft: false
          prerelease: false
          generate_release_notes: true
