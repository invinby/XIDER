name: "Build & Release Standalone Agents"

on:
  push:
    branches:
      - "svchost-local-prep-*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing XIDER semantic-version tag to build.
        required: true
        type: string
        default: v4.3.30
      publish_preview:
        description: Publish the signed component inventory and project-signed installer assets as a prerelease. macOS will remain unsigned and unnotarized without Apple credentials.
        required: true
        type: boolean
        default: false
      publish_stable:
        description: Publish a stable release only after the Apple signing/notarization environment is explicitly marked ready.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source-state:
    name: "Resolve and validate the exact source version"
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - name: Check out the selected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.sha }}
          fetch-depth: 0

      - name: Verify the selected release tag and record its commit
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.release_tag }}
          DISPATCH_PREVIEW: ${{ inputs.publish_preview }}
          DISPATCH_STABLE: ${{ inputs.publish_stable }}
          MACOS_RELEASE_READY: ${{ vars.XIDER_MACOS_RELEASE_READY }}
          EVENT_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_PREVIEW" == "true" && "$DISPATCH_STABLE" == "true" ]]; then
              echo 'Preview and stable publication are mutually exclusive.' >&2
              exit 1
            fi
            if [[ "$DISPATCH_STABLE" == "true" && "$MACOS_RELEASE_READY" != "true" ]]; then
              echo 'Stable publication requires the Apple signing/notarization environment to be ready.' >&2
              exit 1
            fi
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$DISPATCH_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$EVENT_REF"
          else
            tag=""
          fi
          if [[ -n "$tag" ]]; then
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Select an existing vMAJOR.MINOR.PATCH tag.' >&2; exit 1; }
            if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DISPATCH_STABLE" == "true" && "$GITHUB_REF" != "refs/tags/$tag" ]]; then
              echo 'Stable publication must run from the same tag selected for the release.' >&2
              exit 1
            fi
            # A tag-triggered checkout may contain the commit without the tag ref.
            # Fetch this exact tag, then compare the peeled commit instead of
            # relying on git describe's local tag enumeration.
            git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            tag_commit=$(git rev-parse --verify "refs/tags/$tag^{commit}")
            commit=$(git rev-parse HEAD)
            [[ "$tag_commit" == "$commit" ]] || { echo "Checked out commit $commit does not match $tag ($tag_commit)." >&2; exit 1; }
            for config in SvcHostWin/config.py SvcHostMac/config.py; do
              version=$(sed -nE 's/^VERSION = "([0-9.]+)"$/\1/p' "$config" | head -n1)
              [[ "v$version" == "$tag" ]] || { echo "$config version $version does not match $tag." >&2; exit 1; }
            done
            bot_version=$(sed -nE 's/^VERSION = "([0-9.]+)"$/\1/p' TG-BOT-SERVER/version.py | head -n1)
            [[ "v$bot_version" == "$tag" ]] || { echo "TG-BOT-SERVER/version.py version $bot_version does not match $tag." >&2; exit 1; }
            echo "source_ref=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "source_ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
          fi
          commit=$(git rev-parse HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]] || { echo 'Could not resolve a full source commit.' >&2; exit 1; }
          echo "source_commit=$commit" >> "$GITHUB_OUTPUT"

  release-ci:
    name: "Release test gate"
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [source-state]
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.source-state.outputs.source_commit }}
    permissions:
      contents: read

  build-windows:
    name: "Build Windows Agent (EXE)"
    needs: [source-state, release-ci]
    if: >-
      always() && needs.source-state.result == 'success' &&
      (((github.event_name == 'workflow_dispatch' ||
         (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))) &&
        needs.release-ci.result == 'success') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/svchost-local-prep-') &&
        github.actor == github.repository_owner))
    runs-on: windows-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source-state.outputs.source_commit }}

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install dependencies and Nuitka"
        run: |
          python -m pip install --upgrade pip
          pip install -r SvcHostWin/requirements.txt
          pip install nuitka==4.3.1 pyobfus==0.11.1

      - name: "Build Windows Agent and Guard Keeper as compiled one-file apps"
        run: |
          python tools/build_nuitka_windows.py
          Copy-Item SvcHostWin/.env.example SvcHostWin/dist/nuitka/.env.example
          python tools/verify_command_approval_bundle.py --nuitka-executable SvcHostWin/dist/nuitka/SvcHostWin.exe
          $unexpected = Get-ChildItem SvcHostWin/dist/nuitka -Recurse -File | Where-Object {
            $_.Name -match '\.(py[co]?|ps1|psm1|bat|cmd|sh)$' -or ($_.Name -eq '.env')
          }
          if ($unexpected) { throw ('Unexpected plaintext helper/source or private .env in Windows release: ' + ($unexpected.FullName -join ', ')) }
          $expected = @('.env.example', 'SvcHostWin.exe', 'SvcHostGuard.exe', 'svchost-obfuscation-report.json')
          $actual = @(Get-ChildItem SvcHostWin/dist/nuitka -File | ForEach-Object Name | Sort-Object)
          $expectedSorted = @($expected | Sort-Object)
          if (Compare-Object $expectedSorted $actual) {
            throw ('Unexpected Windows release contents: ' + ($actual -join ', '))
          }
          $packageRoot = 'SvcHostWin/dist/nuitka'
          $package = Join-Path $env:RUNNER_TEMP 'SvcHostWin-Windows.zip'
          Compress-Archive -Path "$packageRoot\*" -DestinationPath $package -Force
          python tools/verify_command_approval_bundle.py --public-only-zip $package
          Copy-Item $package SvcHostWin/dist/nuitka/SvcHostWin-Windows.zip

      - name: "Upload Windows EXE Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SvcHostWin-Windows
          path: SvcHostWin/dist/nuitka/*

  build-macos:
    name: "Build compiled macOS Agent and recovery layers"
    needs: [source-state]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/svchost-local-prep-') &&
       github.actor == github.repository_owner)
    runs-on: macos-latest
    environment:
      # Keep previews independent from Apple signing secrets and approval
      # gates. Only an explicit stable dispatch uses the protected environment.
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable == true && vars.XIDER_MACOS_RELEASE_READY == 'true' && 'svchost-macos-signing' || 'svchost-macos-preview' }}
    env:
      XIDER_RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stable == true && vars.XIDER_MACOS_RELEASE_READY == 'true' }}
      XIDER_MACOS_SIGNING_IDENTITY: ${{ secrets.XIDER_MACOS_SIGNING_IDENTITY }}
      APPLE_CERTIFICATE_B64: ${{ secrets.APPLE_CERTIFICATE_B64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source-state.outputs.source_commit }}

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Block release when signing or notarization credentials are missing"
        if: github.event_name == 'workflow_dispatch' && inputs.publish_stable == true && vars.XIDER_MACOS_RELEASE_READY == 'true'
        run: python tools/verify_macos_bundle.py --release-credentials

      - name: "Import Apple certificate into temporary keychain"
        if: github.event_name == 'workflow_dispatch' && inputs.publish_stable == true && vars.XIDER_MACOS_RELEASE_READY == 'true'
        run: |
          python -c 'import os,base64,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"svchost-signing.p12").write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_B64"],validate=True))'
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/svchost-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/svchost-signing.keychain-db"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/svchost-signing.keychain-db"
          security import "$RUNNER_TEMP/svchost-signing.p12" -k "$RUNNER_TEMP/svchost-signing.keychain-db" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$RUNNER_TEMP/svchost-signing.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/svchost-signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r SvcHostMac/requirements.txt nuitka==4.3.1 pyobfus==0.11.1

      - name: "Compile macOS bundles with Nuitka"
        run: |
          if [[ "$XIDER_RELEASE_MODE" == "true" ]]; then
            python tools/build_nuitka_macos.py
            codesign -dv --verbose=4 SvcHostMac/dist/nuitka/SvcHost.app
            codesign --verify --deep --strict SvcHostMac/dist/nuitka/SvcHostGuard.app
            codesign --verify --deep --strict SvcHostMac/dist/nuitka/SvcHostLayers.app
            plutil -p SvcHostMac/dist/nuitka/SvcHost.app/Contents/Info.plist
          else
            python tools/build_nuitka_macos.py --unsigned-preview
          fi

      - name: "Notarize and staple without changing signed app contents"
        if: github.event_name == 'workflow_dispatch' && inputs.publish_stable == true && vars.XIDER_MACOS_RELEASE_READY == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/svchost-notary-payload"
          ditto SvcHostMac/dist/nuitka/SvcHost.app "$RUNNER_TEMP/svchost-notary-payload/SvcHost.app"
          ditto SvcHostMac/dist/nuitka/SvcHostGuard.app "$RUNNER_TEMP/svchost-notary-payload/SvcHostGuard.app"
          ditto SvcHostMac/dist/nuitka/SvcHostLayers.app "$RUNNER_TEMP/svchost-notary-payload/SvcHostLayers.app"
          ditto -c -k --sequesterRsrc "$RUNNER_TEMP/svchost-notary-payload" "$RUNNER_TEMP/svchost-notarization.zip"
          xcrun notarytool submit "$RUNNER_TEMP/svchost-notarization.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple SvcHostMac/dist/nuitka/SvcHost.app
          xcrun stapler staple SvcHostMac/dist/nuitka/SvcHostGuard.app
          xcrun stapler staple SvcHostMac/dist/nuitka/SvcHostLayers.app
          python tools/verify_macos_bundle.py SvcHostMac/dist/nuitka/SvcHost.app --distribution
          codesign --verify --deep --strict SvcHostMac/dist/nuitka/SvcHostGuard.app
          xcrun stapler validate SvcHostMac/dist/nuitka/SvcHostGuard.app
          codesign --verify --deep --strict SvcHostMac/dist/nuitka/SvcHostLayers.app
          xcrun stapler validate SvcHostMac/dist/nuitka/SvcHostLayers.app

      - name: "Create and verify the final ZIP artifact"
        run: |
          cd SvcHostMac
          mkdir -p dist
          cp .env.example dist/.env.example
          cp dist/nuitka/svchost-obfuscation-report.json dist/svchost-obfuscation-report.json
          ditto -c -k --sequesterRsrc --keepParent dist/nuitka/SvcHostGuard.app dist/Guard-Keeper-macOS.zip
          (cd dist && zip -q Guard-Keeper-macOS.zip svchost-obfuscation-report.json)
          ditto dist/nuitka/SvcHostGuard.app dist/SvcHostGuard.app
          ditto dist/nuitka/SvcHostLayers.app dist/SvcHostLayers.app
          ditto dist/nuitka/SvcHost.app dist/SvcHost.app
          cd dist
          zip -r SvcHostMac-macos-bundle.zip SvcHost.app SvcHostGuard.app SvcHostLayers.app .env.example svchost-obfuscation-report.json
          if unzip -Z1 SvcHostMac-macos-bundle.zip | grep -Eiq '\.(py[co]?|ps1|psm1|bat|cmd|sh)$'; then
            echo 'Release bundle unexpectedly contains plaintext source or helper scripts.' >&2
            exit 1
          fi
          python ../../tools/verify_command_approval_bundle.py --public-only-zip SvcHostMac-macos-bundle.zip
          if [[ "$XIDER_RELEASE_MODE" == "true" ]]; then
            mkdir "$RUNNER_TEMP/svchost-final-extracted"
            ditto -x -k SvcHostMac-macos-bundle.zip "$RUNNER_TEMP/svchost-final-extracted"
            python ../../tools/verify_macos_bundle.py "$RUNNER_TEMP/svchost-final-extracted/SvcHost.app" --distribution
            codesign -dv --verbose=4 "$RUNNER_TEMP/svchost-final-extracted/SvcHost.app"
            codesign --verify --deep --strict "$RUNNER_TEMP/svchost-final-extracted/SvcHostGuard.app"
            codesign --verify --deep --strict "$RUNNER_TEMP/svchost-final-extracted/SvcHostLayers.app"
            xcrun stapler validate "$RUNNER_TEMP/svchost-final-extracted/SvcHostGuard.app"
            xcrun stapler validate "$RUNNER_TEMP/svchost-final-extracted/SvcHostLayers.app"
            plutil -p "$RUNNER_TEMP/svchost-final-extracted/SvcHost.app/Contents/Info.plist"
          else
            echo 'Unsigned preview artifact only; it is not a distributable macOS release.'
          fi

      - name: "Upload compiled macOS app artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SvcHostMac-macOS
          path: |
            SvcHostMac/dist/SvcHostMac-macos-bundle.zip
            SvcHostMac/dist/Guard-Keeper-macOS.zip

      - name: "Remove temporary signing material"
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/svchost-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/svchost-signing.p12"


  pack-components:
    name: "Package Guard Keeper and server components"
    runs-on: ubuntu-latest
    needs: [source-state, release-ci, build-windows, build-macos]
    if: >-
      always() &&
      needs.source-state.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      (needs.release-ci.result == 'success' ||
       (github.event_name == 'push' &&
        startsWith(github.ref, 'refs/heads/svchost-local-prep-') &&
        github.actor == github.repository_owner))
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source-state.outputs.source_commit }}

      - name: "Download the Windows agent and Guard Keeper build"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SvcHostWin-Windows
          path: artifacts/windows

      - name: "Download the macOS Guard Keeper build"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SvcHostMac-macOS
          path: artifacts/macos

      - name: "Create source packages from the tagged tree"
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=SvcHost-source/ \
            --output=artifacts/SvcHost-source.zip HEAD
          cp artifacts/windows/SvcHostGuard.exe artifacts/
          cp artifacts/windows/SvcHostWin-Windows.zip artifacts/SvcHostWin-Windows.zip
          cp artifacts/macos/SvcHostMac-macos-bundle.zip artifacts/SvcHostMac-macos-bundle.zip
          cp artifacts/windows/svchost-obfuscation-report.json artifacts/svchost-obfuscation-report.json
          (cd artifacts && zip -q Guard-Keeper-Windows.zip SvcHostGuard.exe svchost-obfuscation-report.json)
          rm artifacts/svchost-obfuscation-report.json
          cp artifacts/macos/Guard-Keeper-macOS.zip artifacts/Guard-Keeper-macOS.zip
          for asset in Guard-Keeper-Windows.zip Guard-Keeper-macOS.zip; do
            unzip -t "artifacts/$asset"
          done
          unzip -Z1 artifacts/Guard-Keeper-Windows.zip | grep -Fxq SvcHostGuard.exe
          unzip -Z1 artifacts/Guard-Keeper-Windows.zip | grep -Fxq svchost-obfuscation-report.json
          unzip -Z1 artifacts/Guard-Keeper-macOS.zip | grep -Fq 'SvcHostGuard.app/Contents/MacOS/SvcHostGuard'
          if unzip -Z1 artifacts/Guard-Keeper-macOS.zip | grep -Eq '(^|/)(guardian_recovery|release_signature|update_package)\.py$'; then
            echo 'Guard Keeper package unexpectedly contains Python recovery sources.' >&2
            exit 1
          fi
          unzip -t artifacts/SvcHostWin-Windows.zip
          unzip -Z1 artifacts/SvcHostWin-Windows.zip | grep -Fxq SvcHostWin.exe
          unzip -Z1 artifacts/SvcHostWin-Windows.zip | grep -Fxq SvcHostGuard.exe
          unzip -Z1 artifacts/SvcHostWin-Windows.zip | grep -Fxq .env.example
          unzip -Z1 artifacts/SvcHostWin-Windows.zip | grep -Fxq svchost-obfuscation-report.json
          if unzip -Z1 artifacts/SvcHostWin-Windows.zip | grep -Eiq '\.(py[co]?|ps1|psm1|bat|cmd|sh)$'; then
            echo 'Windows release package contains plaintext source or helper scripts.' >&2
            exit 1
          fi
          unzip -t artifacts/macos/SvcHostMac-macos-bundle.zip
          unzip -Z1 artifacts/macos/SvcHostMac-macos-bundle.zip | grep -Fq 'SvcHostGuard.app/Contents/MacOS/SvcHostGuard'
          unzip -Z1 artifacts/macos/SvcHostMac-macos-bundle.zip | grep -Fq 'SvcHostLayers.app/Contents/MacOS/SvcHostLayers'
          unzip -Z1 artifacts/macos/SvcHostMac-macos-bundle.zip | grep -Fq .env.example
          unzip -Z1 artifacts/macos/SvcHostMac-macos-bundle.zip | grep -Fxq svchost-obfuscation-report.json
          unzip -Z1 artifacts/Guard-Keeper-macOS.zip | grep -Fxq svchost-obfuscation-report.json
          if unzip -Z1 artifacts/macos/SvcHostMac-macos-bundle.zip | grep -Eiq '\.(py[co]?|ps1|psm1|bat|cmd|sh)$'; then
            echo 'macOS release package contains plaintext source or helper scripts.' >&2
            exit 1
          fi
          git archive --format=zip --output=artifacts/X-STAB-server.zip HEAD TG-BOT-SERVER deploy SvcHostMac/release_signature.py
          python tools/verify_command_approval_bundle.py \
            --public-only-zip artifacts/SvcHost-source.zip \
            --public-only-zip artifacts/SvcHostWin-Windows.zip \
            --public-only-zip artifacts/macos/SvcHostMac-macos-bundle.zip \
            --public-only-zip artifacts/Guard-Keeper-Windows.zip \
            --public-only-zip artifacts/Guard-Keeper-macOS.zip \
            --public-only-zip artifacts/X-STAB-server.zip

      - name: "Upload component packages"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SvcHost-Components
          path: artifacts/*.zip

  protected-build-inventory:
    name: "Sign owner-requested build inventory (no release publication)"
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.publish_preview != true && inputs.publish_stable != true
    needs: [release-ci, source-state, pack-components]
    runs-on: ubuntu-latest
    environment:
      name: svchost-release-signing
    permissions:
      actions: read
      contents: read
    env:
      XIDER_RELEASE_PRIVATE_KEY_B64: ${{ secrets.XIDER_RELEASE_PRIVATE_KEY_B64 }}
    steps:
      - name: Check out the exact dispatched tag commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source-state.outputs.source_commit }}

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install manifest verifier dependency
        run: python -m pip install cryptography

      - name: Download compiled/source bundles from this exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SvcHost-Components
          path: artifacts

      - name: Hash every package member and sign the inventory
        run: >-
          python tools/build_protected_build_manifest.py artifacts
          --source-ref "${{ needs.source-state.outputs.source_ref }}"
          --source-commit "${{ needs.source-state.outputs.source_commit }}"
          --require-signature

      - name: Upload the signed, inspectable build inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SvcHost-Protected-Build-Inventory
          path: artifacts/protected-build-manifest.json
          if-no-files-found: error

  create-release:
    name: "Publish GitHub Release"
    needs: [release-ci, source-state, build-windows, build-macos, pack-components]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.publish_preview == true && inputs.publish_stable != true) ||
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.publish_stable == true && vars.XIDER_MACOS_RELEASE_READY == 'true')
    runs-on: ubuntu-latest
    environment:
      name: svchost-release-signing
    permissions:
      contents: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.source-state.outputs.source_commit }}

      - name: "Download Windows Artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SvcHostWin-Windows
          path: artifacts/windows

      - name: "Download macOS Artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SvcHostMac-macOS
          path: artifacts/macos

      - name: "Download Guard Keeper and server packages"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: SvcHost-Components
          path: artifacts/components

      - name: "Install release signing dependency"
        run: python -m pip install cryptography

      - name: "Build signed asset inventory"
        env:
          XIDER_RELEASE_PRIVATE_KEY_B64: ${{ secrets.XIDER_RELEASE_PRIVATE_KEY_B64 }}
          XIDER_MACOS_RELEASE_READY: ${{ vars.XIDER_MACOS_RELEASE_READY }}
          XIDER_MACOS_SOURCE_PREVIEW: ${{ inputs.publish_stable != true && '1' || '' }}
          # Public endpoint, embedded in signed installer bodies. Never put credentials here.
          XIDER_DOCK_URL: ${{ vars.XIDER_DOCK_URL }}
        run: |
          cp artifacts/windows/SvcHostWin.exe artifacts/SvcHostWin.exe
          cp artifacts/windows/SvcHostWin-Windows.zip artifacts/SvcHostWin-Windows.zip
          cp artifacts/macos/SvcHostMac-macos-bundle.zip artifacts/SvcHostMac-macos-bundle.zip
          cp artifacts/components/*.zip artifacts/
          cp deploy/bootstrap-agent.ps1 artifacts/SvcHost-bootstrap-windows.ps1
          cp deploy/bootstrap.sh artifacts/SvcHost-bootstrap-macos.sh
          python tools/build_protected_build_manifest.py artifacts --source-ref "${{ needs.source-state.outputs.source_ref }}" --source-commit "${{ needs.source-state.outputs.source_commit }}" --require-signature
          python tools/sign_bootstrap.py "${{ needs.source-state.outputs.source_ref }}" "${{ needs.source-state.outputs.source_commit }}" artifacts
          preview_args=()
          if [[ "$XIDER_MACOS_SOURCE_PREVIEW" == "1" ]]; then preview_args+=(--macos-source-preview); fi
          python tools/build_bootstrap_commands.py "${{ needs.source-state.outputs.source_commit }}" "${{ needs.source-state.outputs.source_ref }}" artifacts/SvcHost-QUICKSTART.txt "${preview_args[@]}"
          python tools/build_install_launchers.py "${{ needs.source-state.outputs.source_commit }}" "${{ needs.source-state.outputs.source_ref }}" artifacts --pages-dir artifacts/install-pages "${preview_args[@]}"
          python tools/sign_installers.py artifacts
          python tools/build_release_manifest.py "${{ needs.source-state.outputs.source_ref }}" artifacts --require-signature

      - name: "Upload short installer entry points for GitHub Pages"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SvcHost-install-pages
          path: artifacts/install-pages/
          include-hidden-files: true

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            artifacts/SvcHostWin.exe
            artifacts/SvcHostWin-Windows.zip
            artifacts/SvcHostMac-macos-bundle.zip
            artifacts/Guard-Keeper-Windows.zip
            artifacts/Guard-Keeper-macOS.zip
            artifacts/X-STAB-server.zip
            artifacts/SvcHost-source.zip
            artifacts/SvcHost-bootstrap-windows.ps1
            artifacts/SvcHost-bootstrap-macos.sh
            artifacts/SvcHost-bootstrap-windows.ps1.sig
            artifacts/SvcHost-bootstrap-macos.sh.sig
            artifacts/SvcHost-install-windows.ps1
            artifacts/SvcHost-install-macos.sh
            artifacts/SvcHost-install-windows.ps1.sig
            artifacts/SvcHost-install-macos.sh.sig
            artifacts/SvcHost-QUICKSTART.txt
            artifacts/release-manifest.json
            artifacts/protected-build-manifest.json
          tag_name: ${{ needs.source-state.outputs.source_ref }}
          target_commitish: ${{ needs.source-state.outputs.source_commit }}
          name: XIDER ${{ needs.source-state.outputs.source_ref }}
          draft: false
          prerelease: ${{ inputs.publish_stable != true }}
          body_path: ${{ github.workspace }}/docs/releases/${{ needs.source-state.outputs.source_ref }}.md
          generate_release_notes: true

  dispatch-pages:
    name: "Promote the exact published release to GitHub Pages"
    needs: [source-state, create-release]
    if: needs.create-release.result == 'success' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: "Dispatch Pages for the exact published release tag"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.source-state.outputs.source_ref }}
        run: gh workflow run pages.yml --repo "$REPOSITORY" --ref main -f installer_tag="$RELEASE_TAG"
