name: "Build & Release Standalone Agents"

on:
  push:
    branches:
      - "xider-local-prep-*"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-ci:
    name: "Release test gate"
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-windows:
    name: "Build Windows Agent (EXE)"
    runs-on: windows-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r XGENT-WDS/requirements.txt
          pip install pyinstaller

      - name: "Build Windows EXE via PyInstaller"
        run: |
          cd XGENT-WDS
          pyinstaller --clean XGENT-WDS.spec
          $contents = pyi-archive_viewer -l -r -b .\dist\XGENT-WDS.exe | Out-String
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect XGENT-WDS.exe archive." }
          if ($contents -notmatch '(?m)^\s*release_signature\s*$') {
            throw "The Windows executable does not contain release_signature."
          }
          if ($contents -notmatch '(?m)^\s*update_package\s*$') {
            throw "The Windows executable does not contain update_package."
          }
          if ($contents -notmatch 'cryptography\.hazmat\.primitives\.asymmetric\.ed25519') {
            throw "The Windows executable does not contain Ed25519 verification support."
          }
          Copy-Item .env.example dist/.env.example
          Copy-Item install_agent.ps1 dist/install_agent.ps1
          Copy-Item start_agent.bat dist/start_agent.bat
          Copy-Item stop_agent.bat dist/stop_agent.bat

      - name: "Upload Windows EXE Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XGENT-WDS-Windows
          path: XGENT-WDS/dist/*

  build-macos:
    name: "Build macOS Agent (Mach-O Standalone)"
    runs-on: macos-latest

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python 3.12"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r XGENT-MCS/requirements.txt
          pip install pyinstaller

      - name: "Build macOS Standalone Binary via PyInstaller"
        run: |
          cd XGENT-MCS
          pyinstaller --clean XGENT-MCS.spec
          contents="$(pyi-archive_viewer -l -r -b dist/XGENT-MCS)"
          if ! printf '%s\n' "$contents" | grep -Eq '^[[:space:]]*release_signature[[:space:]]*$'; then
            echo "The macOS executable does not contain release_signature." >&2
            exit 1
          fi
          if ! printf '%s\n' "$contents" | grep -Eq '^[[:space:]]*update_package[[:space:]]*$'; then
            echo "The macOS executable does not contain update_package." >&2
            exit 1
          fi
          chmod +x dist/XGENT-MCS
          cp .env.example dist/.env.example
          cp start_agent.sh dist/start_agent.sh
          cp stop_agent.sh dist/stop_agent.sh
          cd dist
          zip -r XGENT-MCS-macos.zip XGENT-MCS
          zip -r XGENT-MCS-macos-bundle.zip XGENT-MCS .env.example start_agent.sh stop_agent.sh

      - name: "Upload macOS Binary Artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XGENT-MCS-macOS
          path: XGENT-MCS/dist/XGENT-MCS-macos-bundle.zip

  pack-components:
    name: "Package Guard Keeper and server components"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Create source packages from the tagged tree"
        run: |
          mkdir -p artifacts
          git archive --format=zip --prefix=XIDER-source/ \
            --output=artifacts/XIDER-source.zip HEAD
          zip -q artifacts/Guard-Keeper-Windows.zip \
            XGENT-WDS/xider_guardian_wds.py \
            XGENT-WDS/install_guardian.ps1 \
            XGENT-WDS/start_guardian.bat \
            XGENT-WDS/stop_guardian.bat \
            XGENT-WDS/config.py \
            XGENT-WDS/crypto.py \
            XGENT-WDS/xgencrypto.py \
            XGENT-WDS/requirements.txt \
            XGENT-WDS/.env.example
          zip -q artifacts/Guard-Keeper-macOS.zip \
            XGENT-MCS/xider_guardian.py \
            XGENT-MCS/start_guardian.sh \
            XGENT-MCS/config.py \
            XGENT-MCS/crypto.py \
            XGENT-MCS/xgencrypto.py \
            XGENT-MCS/requirements.txt \
            XGENT-MCS/.env.example
          for asset in Guard-Keeper-Windows.zip Guard-Keeper-macOS.zip; do
            unzip -t "artifacts/$asset"
          done
          for file in \
            XGENT-WDS/xider_guardian_wds.py XGENT-WDS/install_guardian.ps1 \
            XGENT-WDS/config.py XGENT-WDS/crypto.py XGENT-WDS/xgencrypto.py \
            XGENT-WDS/requirements.txt XGENT-WDS/.env.example; do
            unzip -Z1 artifacts/Guard-Keeper-Windows.zip | grep -Fxq "$file"
          done
          for file in \
            XGENT-MCS/xider_guardian.py XGENT-MCS/start_guardian.sh \
            XGENT-MCS/config.py XGENT-MCS/crypto.py XGENT-MCS/xgencrypto.py \
            XGENT-MCS/requirements.txt XGENT-MCS/.env.example; do
            unzip -Z1 artifacts/Guard-Keeper-macOS.zip | grep -Fxq "$file"
          done
          git archive --format=zip --output=artifacts/X-STAB-server.zip HEAD TG-BOT-SERVER deploy

      - name: "Upload component packages"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XIDER-Components
          path: artifacts/*.zip

  create-release:
    name: "Publish GitHub Release"
    needs: [release-ci, build-windows, build-macos, pack-components]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: xider-release-signing
    permissions:
      contents: write

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Download Windows Artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XGENT-WDS-Windows
          path: artifacts/windows

      - name: "Download macOS Artifact"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XGENT-MCS-macOS
          path: artifacts/macos

      - name: "Download Guard Keeper and server packages"
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XIDER-Components
          path: artifacts/components

      - name: "Install release signing dependency"
        run: python -m pip install cryptography

      - name: "Build signed asset inventory"
        env:
          XIDER_RELEASE_PRIVATE_KEY_B64: ${{ secrets.XIDER_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          cp artifacts/windows/XGENT-WDS.exe artifacts/XGENT-WDS.exe
          cp artifacts/macos/XGENT-MCS-macos-bundle.zip artifacts/XGENT-MCS-macos-bundle.zip
          cp artifacts/components/*.zip artifacts/
          cp deploy/bootstrap.ps1 artifacts/XIDER-bootstrap-windows.ps1
          cp deploy/bootstrap.sh artifacts/XIDER-bootstrap-macos.sh
          python tools/build_bootstrap_commands.py "${GITHUB_SHA}" artifacts/XIDER-QUICKSTART.txt
          python tools/build_release_manifest.py "${GITHUB_REF_NAME}" artifacts --require-signature

      - name: "Create GitHub Release"
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: |
            artifacts/XGENT-WDS.exe
            artifacts/XGENT-MCS-macos-bundle.zip
            artifacts/Guard-Keeper-Windows.zip
            artifacts/Guard-Keeper-macOS.zip
            artifacts/X-STAB-server.zip
            artifacts/XIDER-source.zip
            artifacts/XIDER-bootstrap-windows.ps1
            artifacts/XIDER-bootstrap-macos.sh
            artifacts/XIDER-QUICKSTART.txt
            artifacts/release-manifest.json
          draft: false
          prerelease: false
          generate_release_notes: true
