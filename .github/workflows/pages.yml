name: "Build and validate Pages source (no publish)"

on:
  push:
    branches: ["main", "master", "xider-local-prep-*"]
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tools/test_site.py"
      - "tools/test_pages_workflow.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tools/test_site.py"
      - "tools/test_pages_workflow.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: "Validate static Pages source"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: "Install test runner"
        run: python -m pip install pytest

      - name: "Test site and workflow contracts"
        run: python -m pytest tools/test_site.py tools/test_pages_workflow.py -q

      - name: "Check static site links and accessibility basics"
        run: python tools/check_site.py

      - name: "Package static files for later approved publication"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
