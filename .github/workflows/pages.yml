name: "Build and deploy XIDER Pages"

on:
  push:
    branches: ["main", "master", "xider-local-prep-*"]
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tools/test_site.py"
      - "tools/test_pages_workflow.py"
      - "tools/build_pages_entrypoints.py"
      - "tools/build_install_launchers.py"
      - "tools/build_bootstrap_commands.py"
      - "XGENT-MCS/release_signature.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tools/test_site.py"
      - "tools/test_pages_workflow.py"
      - "tools/build_pages_entrypoints.py"
      - "tools/build_install_launchers.py"
      - "tools/build_bootstrap_commands.py"
      - "XGENT-MCS/release_signature.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      installer_tag:
        description: Published XIDER release tag whose installers Pages should promote (blank selects latest).
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: "Validate static Pages source"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: "Install test runner"
        run: python -m pip install pytest cryptography

      - name: "Test site and workflow contracts"
        run: python -m pytest tools/test_site.py tools/test_pages_workflow.py -q

      - name: "Resolve published installer release"
        id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.installer_tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG:-}"
          if [[ -z "$tag" ]]; then
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '[.[] | select(.draft == false and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.published_at) | last | .tag_name')"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "No valid published XIDER installer release found." >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: "Generate signed installer entry points"
        env:
          XIDER_WINDOWS_INSTALLER_TAG: ${{ steps.release-tag.outputs.tag }}
          XIDER_MACOS_INSTALLER_TAG: ${{ steps.release-tag.outputs.tag }}
          XIDER_MACOS_SOURCE_PREVIEW: '1'
        run: python tools/build_pages_entrypoints.py site

      - name: "Check static site links and accessibility basics"
        run: python tools/check_site.py

      - name: "Package static files for GitHub Pages"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: "Publish validated site"
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy GitHub Pages artifact"
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
