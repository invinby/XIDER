name: "Build and deploy XIDER Pages"

on:
  push:
    branches: ["main", "master", "xider-local-prep-*"]
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tools/test_site.py"
      - "tools/test_pages_workflow.py"
      - "tools/build_pages_entrypoints.py"
      - "tools/build_install_launchers.py"
      - "tools/build_bootstrap_commands.py"
      - "XGENT-MCS/release_signature.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "site/**"
      - "tools/check_site.py"
      - "tools/test_site.py"
      - "tools/test_pages_workflow.py"
      - "tools/build_pages_entrypoints.py"
      - "tools/build_install_launchers.py"
      - "tools/build_bootstrap_commands.py"
      - "XGENT-MCS/release_signature.py"
      - ".github/workflows/pages.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: "Validate static Pages source"
    runs-on: ubuntu-latest
    steps:
      - name: "Check out source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: "Install test runner"
        run: python -m pip install pytest cryptography

      - name: "Test site and workflow contracts"
        run: python -m pytest tools/test_site.py tools/test_pages_workflow.py -q

      - name: "Generate signed installer entry points"
        env:
          XIDER_WINDOWS_INSTALLER_TAG: v4.3.2
        run: python tools/build_pages_entrypoints.py site

      - name: "Check static site links and accessibility basics"
        run: python tools/check_site.py

      - name: "Package static files for GitHub Pages"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: "Publish validated site"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "Deploy GitHub Pages artifact"
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
