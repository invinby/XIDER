name: XIDER signed Windows and macOS source-preview installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing XIDER source tag to package (must match agent VERSION).
        required: true
        default: v4.3.11

permissions:
  contents: read

jobs:
  release-state:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - id: check
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid XIDER release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/$TAG")
          if [[ "$status" == 200 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif [[ "$status" == 404 ]]; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo "Could not inspect release state (HTTP $status)." >&2
            exit 1
          fi

  build-windows:
    needs: release-state
    if: needs.release-state.outputs.exists == 'false'
    runs-on: windows-latest
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out reviewed source snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-state.outputs.tag }}

      - name: Pin exact selected-tag commit for this release transaction
        id: source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-f]{40}$') { throw 'Could not resolve the selected source tag to a commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Compile Windows Agent and Guard Keeper
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release-state.outputs.tag }}
        run: |
          $versionMatch = Select-String -Path XGENT-WDS/config.py -Pattern '^VERSION = "([0-9.]+)"$'
          $version = $versionMatch.Matches.Groups[1].Value
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Source version $version does not match release tag $env:RELEASE_TAG." }
          python -m pip install --upgrade pip
          python -m pip install -r XGENT-WDS/requirements.txt nuitka==4.3.1
          python tools/build_nuitka_windows.py
          Copy-Item XGENT-WDS/.env.example XGENT-WDS/dist/nuitka/.env.example
          python tools/verify_command_approval_bundle.py --nuitka-executable XGENT-WDS/dist/nuitka/XGENT-WDS.exe
          $expected = @('.env.example', 'XGENT-WDS.exe', 'XIDER-Guard-Keeper.exe') | Sort-Object
          $actual = @(Get-ChildItem XGENT-WDS/dist/nuitka -Force -File | ForEach-Object Name | Sort-Object)
          Write-Host "Compiled Windows package files: $($actual -join ', ')"
          if (Compare-Object $expected $actual) { throw "Unexpected compiled Windows package contents: $($actual -join ', ')" }
          $package = Join-Path $env:RUNNER_TEMP 'XGENT-WDS-Windows.zip'
          $packageFiles = @($expected | ForEach-Object { Join-Path 'XGENT-WDS/dist/nuitka' $_ })
          Compress-Archive -LiteralPath $packageFiles -DestinationPath $package -Force
          python tools/verify_command_approval_bundle.py --public-only-zip $package
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item XGENT-WDS/dist/nuitka/XGENT-WDS.exe artifacts/
          Copy-Item XGENT-WDS/dist/nuitka/XIDER-Guard-Keeper.exe artifacts/
          Copy-Item $package artifacts/XGENT-WDS-Windows.zip

      - name: Upload compiled Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XIDER-Windows-Release
          path: artifacts/*

  publish-windows:
    needs: [release-state, build-windows]
    if: needs.release-state.outputs.exists == 'false'
    runs-on: ubuntu-latest
    environment:
      name: xider-release-signing
    permissions:
      contents: write
    env:
      XIDER_RELEASE_PRIVATE_KEY_B64: ${{ secrets.XIDER_RELEASE_PRIVATE_KEY_B64 }}
    steps:
      - name: Check out tools and signing policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.build-windows.outputs.source_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install release signing dependency
        run: python -m pip install cryptography

      - name: Download compiled Windows package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: XIDER-Windows-Release
          path: artifacts

      - name: Build and sign Windows-only release inventory
        env:
          TAG: ${{ needs.release-state.outputs.tag }}
          BUILD_SHA: ${{ needs.build-windows.outputs.source_commit }}
        run: |
          set -euo pipefail
          COMMIT=$(git rev-parse "${BUILD_SHA}^{commit}")
          mkdir -p artifacts
          git archive --format=zip --prefix=XIDER-source/ "$COMMIT" > artifacts/XIDER-source.zip
          git show "${COMMIT}:deploy/bootstrap-agent.ps1" > artifacts/XIDER-bootstrap-windows.ps1
          git show "${COMMIT}:deploy/bootstrap.sh" > artifacts/XIDER-bootstrap-macos.sh
          (cd artifacts && zip -q Guard-Keeper-Windows.zip XIDER-Guard-Keeper.exe)
          python tools/build_install_launchers.py "$COMMIT" "$TAG" artifacts --macos-source-preview
          python tools/sign_bootstrap.py "$TAG" "$COMMIT" artifacts
          python tools/sign_installers.py artifacts
          python - "$COMMIT" "$TAG" artifacts/XIDER-QUICKSTART.txt <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("tools").resolve()))
          from build_bootstrap_commands import build_platform_commands
          commit, tag, output = sys.argv[1:]
          commands = build_platform_commands(commit, tag, macos_source_preview=True)
          command = commands["windows"]
          mac_command = commands["macos"]
          Path(output).write_text(
              f"XIDER {tag} — Windows + macOS source preview\nCommit: {commit}\n\n"
              f"Windows PowerShell:\n{command}\n\nmacOS Terminal (source preview; runtime is not Apple-signed or notarized):\n{mac_command}\n",
              encoding="utf-8",
          )
          PY
          python tools/build_release_manifest.py "$TAG" artifacts --platform windows --platform macos --exclude-asset XGENT-MCS-macos-bundle.zip --exclude-asset Guard-Keeper-macOS.zip --require-signature
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("XGENT-MCS").resolve()))
          from release_signature import verify_manifest_signature
          verify_manifest_signature(json.loads(Path("artifacts/release-manifest.json").read_text(encoding="utf-8")))
          PY

      - name: Publish signed Windows and macOS source-preview installers
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ needs.release-state.outputs.tag }}
          name: XIDER ${{ needs.release-state.outputs.tag }} — Windows preview + macOS source preview
          prerelease: true
          draft: false
          body: |
            Signed Windows Agent and Guard Keeper package plus a signed macOS source-preview installer. When a local `.env` is absent, each installer uses X-Dock enrollment; neither asks for a VPS SSH password.

            macOS source preview uses the pinned XIDER source and Python runtime. Its bootstrap and installer are publisher-signed, but the runtime is not Apple-signed or notarized. This is not the full compiled macOS app release; Safari and Siri installation are reported as separate verified steps.
            The signed manifest pins the exact source commit used to build these assets.
          files: |
            artifacts/XIDER-source.zip
            artifacts/XGENT-WDS.exe
            artifacts/XIDER-Guard-Keeper.exe
            artifacts/Guard-Keeper-Windows.zip
            artifacts/XGENT-WDS-Windows.zip
            artifacts/XIDER-bootstrap-windows.ps1
            artifacts/XIDER-bootstrap-macos.sh
            artifacts/XIDER-bootstrap-windows.ps1.sig
            artifacts/XIDER-bootstrap-macos.sh.sig
            artifacts/XIDER-install-windows.ps1
            artifacts/XIDER-install-macos.sh
            artifacts/XIDER-install-windows.ps1.sig
            artifacts/XIDER-install-macos.sh.sig
            artifacts/XIDER-QUICKSTART.txt
            artifacts/release-manifest.json
