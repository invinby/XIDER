name: "CI - Test Suite"

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact source commit to validate when called by a release build.
        required: false
        type: string
  push:
    branches: [ "main", "master", "xider-local-prep-*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  shell:
    name: "Validate Unix installers"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: "Set up Node.js for the pinned Mermaid parser"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json
      - name: "Install pinned documentation parser"
        run: npm ci --prefix tools
      - name: "Set up Python for documentation checks"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: "Block tracked credential and private-key files"
        run: python tools/check_tracked_secrets.py
      - name: "Install documentation test runner"
        run: python -m pip install pytest
      - name: "Validate bilingual documentation and Mermaid diagrams"
        run: |
          python -m pytest tools/test_readme_parity.py tools/test_validate_mermaid.py tools/test_readme_mermaid.py -q
          python tools/validate_mermaid.py README.md README.ru.md
      - name: "Check shell syntax"
        run: |
          find deploy XGENT-MCS -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: "Exercise server operations argument gate"
        run: |
          bash deploy/tests/test_server_ops_wrapper.sh
      - name: "Exercise VPS update and rollback in an isolated fixture"
        run: |
          bash deploy/tests/test_update_server.sh
      - name: "Exercise macOS LaunchAgent status in an isolated fixture"
        run: |
          bash deploy/tests/test_macos_launch_status.sh
      - name: "Exercise macOS bootstrap activation and rollback"
        run: |
          bash deploy/tests/test_bootstrap_macos_transaction.sh

  test:
    name: "Run Pytest (Python ${{ matrix.python-version }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.14"]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: "Set up Node.js for the pinned Mermaid parser"
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tools/package-lock.json

      - name: "Install pinned documentation parser"
        run: npm ci --prefix tools

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            TG-BOT-SERVER/requirements.txt
            XGENT-WDS/requirements.txt
            XGENT-MCS/requirements.txt

      - name: "Install component dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r TG-BOT-SERVER/requirements.txt
          pip install -r XGENT-WDS/requirements.txt
          pip install pytest pytest-asyncio

      - name: "Validate PowerShell installer syntax"
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path deploy,XGENT-WDS -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; throw "PowerShell syntax error in $($file.FullName)" }
          }

      - name: "Validate Python source syntax"
        shell: pwsh
        run: |
          $exclude = '(^|[\\/])(\.venv|venv|node_modules|build|dist|__pycache__)([\\/]|$)'
          python -m compileall -q -x $exclude TG-BOT-SERVER XGENT-WDS XGENT-MCS ops tools deploy

      - name: "Validate Windows PowerShell 5 installer syntax"
        shell: powershell
        run: |
          $files = Get-ChildItem -Path deploy,XGENT-WDS -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; throw "Windows PowerShell 5 syntax error in $($file.FullName)" }
          }

      - name: "Exercise Windows agent installer selection"
        shell: pwsh
        run: ./deploy/tests/test_install_agent.ps1

      - name: "Exercise Windows bootstrap preflight"
        shell: pwsh
        run: ./deploy/tests/test_bootstrap_agent_preflight.ps1

      - name: "Exercise Windows PowerShell 5 bootstrap preflight"
        shell: powershell
        run: .\deploy\tests\test_bootstrap_agent_preflight.ps1

      - name: "Exercise full-setup security preflight"
        shell: pwsh
        run: ./deploy/tests/test_setup_all_preflight.ps1

      - name: "Exercise full-setup security preflight with Windows PowerShell 5"
        shell: powershell
        run: .\deploy\tests\test_setup_all_preflight.ps1

      - name: "Exercise Windows staged install and rollback"
        shell: powershell
        run: .\deploy\tests\test_bootstrap_agent_swap.ps1

      - name: "Exercise Windows install report and rollback health"
        shell: powershell
        run: .\deploy\tests\test_install_report_windows.ps1

      - name: "Exercise full Windows bootstrap transaction"
        shell: pwsh
        run: ./deploy/tests/test_bootstrap_transaction.ps1

      - name: "Exercise full Windows bootstrap transaction with Windows PowerShell 5"
        shell: powershell
        run: .\deploy\tests\test_bootstrap_transaction.ps1

      - name: "Run every isolated component suite"
        run: python tools/run_tests.py
