name: "CI - Test Suite"

on:
  push:
    branches: [ "main", "master", "xider-local-prep-*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  shell:
    name: "Validate Unix installers"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
      - name: "Check shell syntax"
        run: |
          find deploy XGENT-MCS -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: "Exercise VPS update and rollback in an isolated fixture"
        run: |
          bash deploy/tests/test_update_server.sh

  test:
    name: "Run Pytest (Python ${{ matrix.python-version }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            TG-BOT-SERVER/requirements.txt
            XGENT-WDS/requirements.txt
            XGENT-MCS/requirements.txt

      - name: "Install component dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r TG-BOT-SERVER/requirements.txt
          pip install -r XGENT-WDS/requirements.txt
          pip install pytest pytest-asyncio

      - name: "Validate PowerShell installer syntax"
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path deploy,XGENT-WDS -Recurse -Filter *.ps1
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; throw "PowerShell syntax error in $($file.FullName)" }
          }

      - name: "Exercise Windows agent installer selection"
        shell: pwsh
        run: ./deploy/tests/test_install_agent.ps1

      - name: "Run every isolated component suite"
        run: python tools/run_tests.py
