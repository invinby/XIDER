name: "XIDER signed server deployment bundle"

on:
  push:
    tags: ["server-deploy-*"]

permissions:
  contents: read

jobs:
  build-server-bundle:
    name: "Build and sign the exact server source"
    runs-on: ubuntu-latest
    environment:
      name: xider-release-signing
    permissions:
      contents: read

    steps:
      - name: "Checkout tagged source"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python"
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: "Install signing dependency"
        run: python -m pip install cryptography

      - name: "Package and sign server source"
        env:
          XIDER_RELEASE_PRIVATE_KEY_B64: ${{ secrets.XIDER_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git archive --format=zip --prefix=XIDER-source/ --output=artifacts/XIDER-source.zip HEAD
          key_path="$RUNNER_TEMP/xider-release-signing.pem"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$XIDER_RELEASE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          python tools/sign_server_bundle.py \
            --bundle artifacts/XIDER-source.zip \
            --manifest artifacts/release-manifest.json \
            --key "$key_path" \
            --release "$GITHUB_REF_NAME"
          unset XIDER_RELEASE_PRIVATE_KEY_B64
          python deploy/verify_server_bundle.py \
            artifacts/release-manifest.json artifacts/XIDER-source.zip

      - name: "Upload signed server deployment artifact"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XIDER-server-deploy-bundle
          path: |
            artifacts/XIDER-source.zip
            artifacts/release-manifest.json
          if-no-files-found: error
